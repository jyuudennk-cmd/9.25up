<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドコモ新料金プラン クイックチェック (全50問)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .card-transition { transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); }
    button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans min-h-screen flex flex-col items-center py-8 px-4">

  <div class="max-w-2xl w-full">
    <!-- ヘッダー -->
    <div class="text-center mb-6">
      <h1 class="text-2xl md:text-3xl font-extrabold text-red-600 mb-1">ドコモ新プラン 習熟単語帳</h1>
      <p class="text-xs md:text-sm text-gray-500 font-medium">2026年9月25日発表 / 接客ナレッジ完全対応（全50問）</p>
    </div>

    <!-- コントロールバー -->
    <div class="flex justify-between items-center mb-3 px-2">
      <span id="category-badge" class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold border border-red-200">カテゴリ</span>
      <span id="counter" class="text-gray-600 font-bold text-sm">1 / 50</span>
    </div>

    <!-- 単語帳カード -->
    <div class="perspective-1000 w-full h-80 md:h-72 mb-6 cursor-pointer" onclick="flipCard()">
      <div id="card-inner" class="relative w-full h-full transform-style-3d card-transition shadow-md rounded-2xl">
        
        <!-- 表面 (問題) -->
        <div class="absolute w-full h-full backface-hidden bg-white border border-gray-200 rounded-2xl flex flex-col justify-between p-6 md:p-8">
          <div class="flex items-center space-x-2">
            <span class="bg-red-600 text-white text-xs px-2 py-0.5 rounded font-bold">Q</span>
            <span class="text-xs text-gray-400 font-bold">問題</span>
          </div>
          <p id="question-text" class="text-base md:text-lg font-bold text-center leading-relaxed text-gray-800 my-auto"></p>
          <span class="text-center text-xs text-gray-400 font-medium">💡 カードをタップして解答を表示</span>
        </div>

        <!-- 裏面 (解答) -->
        <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-red-50 border border-red-200 rounded-2xl flex flex-col justify-between p-6 md:p-8">
          <div class="flex items-center space-x-2">
            <span class="bg-gray-800 text-white text-xs px-2 py-0.5 rounded font-bold">A</span>
            <span class="text-xs text-red-500 font-bold">解答・接客ポイント</span>
          </div>
          <p id="answer-text" class="text-sm md:text-base font-bold text-center leading-relaxed text-red-950 my-auto"></p>
          <span class="text-center text-xs text-red-400 font-medium">💡 タップで問題に戻る</span>
        </div>

      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="flex flex-col space-y-3">
      <div class="flex justify-between space-x-3">
        <button onclick="prevCard()" class="flex-1 bg-white border border-gray-300 text-gray-700 py-3 rounded-xl font-bold shadow-sm hover:bg-gray-50 transition active:scale-95">前へ</button>
        <button onclick="flipCard()" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-red-700 transition active:scale-95">めくる</button>
        <button onclick="nextCard()" class="flex-1 bg-white border border-gray-300 text-gray-700 py-3 rounded-xl font-bold shadow-sm hover:bg-gray-50 transition active:scale-95">次へ</button>
      </div>
      <button onclick="shuffleCards()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold shadow-sm hover:bg-slate-900 transition active:scale-95 flex items-center justify-center space-x-2">
        <span>🔀 ランダム出題（シャッフル）</span>
      </button>
    </div>
  </div>

  <script>
    // 全50問のマスターデータ
    const masterData = [
      // --- ahamo リニューアル (1-12) ---
      { cat: "ahamo", q: "ahamoのリニューアル実施日は？", a: "2026年12月1日（火）。既存ユーザーも自動適用。" },
      { cat: "ahamo", q: "ahamoの新しいデータ容量ステップは？", a: "「40GB・60GB・120GB」の3段階制。使い勝手が大幅向上。" },
      { cat: "ahamo", q: "ahamoの40GB利用時の月額料金は？", a: "月額3,135円（税込）。今までの期間限定キャンペーンではなく恒常で40GBまで使える魅力をアピール。" },
      { cat: "ahamo", q: "ahamo新機能「上限設定オプション」の料金は？", a: "月額無料。設定したデータ量でストップできる安心機能。" },
      { cat: "ahamo", q: "既存ahamoユーザーの12月1日時点での上限設定はどうなる？", a: "自動で「40GB上限」に設定。意図しない料金アップを防ぐ親切設計。" },
      { cat: "ahamo", q: "ahamo段階制導入による最大の利便性メリットは？", a: "追加パケットの購入手続きが不要。使った分だけ自動で最適な段階が適用。" },
      { cat: "ahamo", q: "ahamo「爆アゲ セレクション」の還元率はどう変わる？", a: "対象サービス月額の最大25%（dポイント・期間用途限定）へ拡大。エンタメ重視派に最適。" },
      { cat: "ahamo", q: "ahamoの海外データ利用量はどう強化された？", a: "40GBまで増量。海外旅行・出張時も追加料金なしでそのまま使えて安心。" },
      { cat: "ahamo", q: "ahamoのリニューアルコンセプトを一言で表すと？", a: "「シンプルな基本料はそのままに、使いたい月も手続きなしで柔軟に使える進化」。" },
      { cat: "ahamo", q: "ahamoで使いすぎが心配なお客様への決定打は？", a: "無料の「上限設定オプション」で40GBに固定すれば、段階が上がることなく安心。" },
      { cat: "ahamo", q: "ahamoで速度制限がかかった後の対応は？", a: "上限設定を解除または変更すれば、即座に上の段階（60GB/120GB）へスムーズ移行可能。" },
      { cat: "ahamo", q: "ahamoのシンプルさを評価するお客様への訴求ポイントは？", a: "面倒な手続きなしで自動的に最適な容量帯に収まる、スマートな料金体系。" },

      // --- ドコモ mini2 (13-27) ---
      { cat: "ドコモ mini2", q: "「ドコモ mini2」の提供開始日は？", a: "2026年12月1日（火）。小容量〜中容量層向けの新定番。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」のデータ容量ステップは？", a: "「～6GB」と「～12GB」の2段階制。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」割引適用前の基本月額料金は？", a: "～6GB：3,278円（税込） / ～12GB：4,598円（税込）。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」で6GB利用時、各種割引適用後の最安料金は？", a: "月額858円（税込）。非常に手頃な維持費を実現。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」で12GB利用時、各種割引適用後の最安料金は？", a: "月額2,178円（税込）。たっぷり使ってもリーズナブル。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」は家族間国内通話無料に対応している？", a: "対応。ファミリー割引グループ内の家族通話は24時間無料。" },
      { cat: "ドコモ mini2", q: "「みんなドコモ割」の割引額（2回線以上）は？", a: "▲550円（税込）割引。" },
      { cat: "ドコモ mini2", q: "「dカードお支払割」で最大550円（税込）割引になる対象カードは？", a: "dカード PLATINUM / GOLD / GOLD U。" },
      { cat: "ドコモ mini2", q: "「ドコモ光セット割 / home 5Gセット割」の割引額は？", a: "▲1,210円（税込）割引。" },
      { cat: "ドコモ mini2", q: "「ドコモでんきセット割」の割引額は？", a: "▲110円（税込）割引。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」で60歳以上のお客様が得られる通話特典は？", a: "「かけ放題オプション（税込1,980円）」が半額の月額990円（税込）で利用可能。" },
      { cat: "ドコモ mini2", q: "従来の「ドコモ mini」の新規受付終了日は？", a: "2026年11月30日（月）。" },
      { cat: "ドコモ mini2", q: "既存の「ドコモ mini」ユーザーはそのまま使い続けられる？", a: "継続可能。ただし「mini2」の方がお得になる場合があるため比較を案内。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」の主なターゲット層は？", a: "小〜中容量で十分かつ、家族通話やセット割を活用したいご家族層。" },
      { cat: "ドコモ mini2", q: "「ドコモ mini2」を勧める際の決め台詞は？", a: "「使わない月は安く、少し多く使う月も12GBまで自動カバーできる万能プラン」。" },

      // --- ドコモ MAX 60歳以上割 (28-37) ---
      { cat: "MAX 60歳以上割", q: "「ドコモ MAX 60歳以上割」の提供開始日は？", a: "2026年10月1日（木）。他施策に先駆けて先行スタート。" },
      { cat: "MAX 60歳以上割", q: "「ドコモ MAX 60歳以上割」の対象条件は？", a: "60歳以上のお客様が「ドコモ MAX」をご契約すること。" },
      { cat: "MAX 60歳以上割", q: "「ドコモ MAX 60歳以上割」の適用期間は？", a: "最大3か月間。" },
      { cat: "MAX 60歳以上割", q: "「ドコモ MAX 60歳以上割」の最大月額割引額は？", a: "最大▲2,970円（税込）割引。" },
      { cat: "MAX 60歳以上割", q: "割引期間中、1GB以下利用時の最安月額料金は？", a: "月額858円（税込）。各種割引フル適用時。" },
      { cat: "MAX 60歳以上割", q: "割引期間中、1GB超〜3GB利用時の最安月額料金は？", a: "月額858円（税込）。割引拡大により1GB以下と同額で利用可能。" },
      { cat: "MAX 60歳以上割", q: "割引期間中、無制限利用時の最安月額料金は？", a: "月額4,928円（税込）。無制限もおトクに体験可能。" },
      { cat: "MAX 60歳以上割", q: "「ドコモ MAX 60歳以上割」適用時に進呈されるボーナスパケットは？", a: "+27GB/月（最大3か月間）。動画やコンテンツを存分に楽しめる。" },
      { cat: "MAX 60歳以上割", q: "60歳以上のお客様へ「ドコモ MAX」を体験してもらうメリットは？", a: "エンタメ特典やライブ招待など、スマホを使った新しい楽しみの発見につながる。" },
      { cat: "MAX 60歳以上割", q: "4か月目以降（割引終了後）のフォローポイントは？", a: "使い方に合わせて「ドコモ mini2」等の最適プランへ柔軟に見直せる安心感を提供。" },

      // --- 料金改定・海外機能 (38-44) ---
      { cat: "料金改定・海外", q: "一部旧プランの月額料金改定（値上げ）の実施日は？", a: "2026年12月1日（火）。" },
      { cat: "料金改定・海外", q: "旧プラン料金改定の背景・理由は？", a: "物価・人件費上昇の中で、安定した通信品質とサポート体制を維持するため。" },
      { cat: "料金改定・海外", q: "料金改定対象の主なプランは？", a: "新規受付を終了している過去の料金プラン中心。" },
      { cat: "料金改定・海外", q: "旧プランユーザーからの問合せに対するポジティブな切り返しは？", a: "「通信品質維持のための改定ですが、お客様の今の使い方なら最新プランへ変える方が安くなる可能性があります！ぜひ見直しましょう」。" },
      { cat: "料金改定・海外", q: "海外利用時のデータ増量は何GBまで？", a: "40GBまで増量（ahamo / ドコモ MAX等対象）。" },
      { cat: "料金改定・海外", q: "長期間海外に滞在するお客様向けの新しい海外機能は？", a: "15日経過後も通常速度で利用できる継続オプション等の提供。" },
      { cat: "料金改定・海外", q: "旧プラン継続 vs 最新プラン変更の提案軸は？", a: "「料金改定を機に、セット割や最新のデータ段階に合わせた最適なプランへのアップデート」を提案。" },

      // --- 接客マインド・トータルアプローチ (45-50) ---
      { cat: "接客マインド", q: "お客様にプラン見直しを提案する際の基本アプローチは？", a: "「安くすること」だけでなく、「生活がより便利・楽しくなる価値」を合わせて届ける。" },
      { cat: "接客マインド", q: "「値上げ」と聞いて不満を感じているお客様への寄り添い方は？", a: "ご理解に感謝しつつ、無駄なオプションの整理や新プラン適用で、トータル支払額を抑える診断を実施。" },
      { cat: "接客マインド", q: "シニア層（60歳以上）へのアプローチのポイントは？", a: "かけ放題割引のある「mini2」か、エンタメ体験ができる「MAX（60歳以上割）」の2軸でニーズに合わせて選択肢を提示。" },
      { cat: "接客マインド", q: "ahamoとドコモ mini2の簡単な使い分け基準は？", a: "店頭サポート重視・家族割・固定回線セットなら「mini2」、オンライン完結・中〜大容量・単身なら「ahamo」。" },
      { cat: "接客マインド", q: "今回の改定・新プラン発表における最大の営業チャンスは？", a: "全ユーザーに対して「ライフスタイルに合わせた料金の最適化診断」を実施する絶好のきっかけ。" },
      { cat: "接客マインド", q: "販売員として目指すべきゴールは？", a: "お客様の不安を解消し、「見直してよかった！満足度が上がった」と感じていただくこと。" }
    ];

    let flashcards = [...masterData];
    let currentIndex = 0;
    let isFlipped = false;

    const cardInner = document.getElementById('card-inner');
    const questionText = document.getElementById('question-text');
    const answerText = document.getElementById('answer-text');
    const categoryBadge = document.getElementById('category-badge');
    const counter = document.getElementById('counter');

    function init() {
      updateCard();
    }

    function updateCard() {
      if(isFlipped) {
        cardInner.classList.remove('rotate-y-180');
        isFlipped = false;
        setTimeout(() => setContent(), 250);
      } else {
        setContent();
      }
    }

    function setContent() {
      const current = flashcards[currentIndex];
      questionText.innerText = current.q;
      answerText.innerText = current.a;
      categoryBadge.innerText = current.cat;
      counter.innerText = `${currentIndex + 1} / ${flashcards.length}`;
    }

    function flipCard() {
      isFlipped = !isFlipped;
      cardInner.classList.toggle('rotate-y-180', isFlipped);
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % flashcards.length;
      updateCard();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
      updateCard();
    }

    function shuffleCards() {
      for (let i = flashcards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
      }
      currentIndex = 0;
      updateCard();
    }

    window.onload = init;
  </script>
</body>
</html>
